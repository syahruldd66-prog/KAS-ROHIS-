<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Online - Kas Rohis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <nav class="bg-emerald-900 text-white p-4 shadow-md flex justify-between items-center">
        <a href="index.html" class="text-sm bg-emerald-800 px-3 py-1 rounded-lg">← Kembali</a>
        <h1 class="font-bold text-lg">Pembayaran Kas Online</h1>
        <div></div>
    </nav>

    <div class="max-w-md mx-auto p-4 mt-4">
        
        <div class="bg-white rounded-xl shadow p-5 mb-6">
            <h3 class="font-bold text-gray-800 mb-3">Pilih Metode Pembayaran:</h3>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="pilihMetode('qris')" id="btn-qris" class="p-3 border-2 border-emerald-600 rounded-xl text-center font-bold text-emerald-900 bg-emerald-50 transition">
                    📱 QRIS
                </button>
                <button onclick="pilihMetode('dana')" id="btn-dana" class="p-3 border-2 border-gray-300 rounded-xl text-center font-bold text-gray-700 transition">
                    💸 Nomor DANA
                </button>
            </div>

            <div id="info-pembayaran" class="mt-5 text-center bg-gray-50 p-4 rounded-xl border">
                </div>
        </div>

        <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-bold text-emerald-900 mb-4">✍️ Konfirmasi Pembayaran</h3>
            
            <form id="form-bayar" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: XI IPA 1" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nominal Pembayaran (Rp)</label>
                    <input type="number" id="jumlah" placeholder="Contoh: 5000" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow transition">
                    Kirim Konfirmasi Pembayaran
                </button>
            </form>
        </div>

    </div>

    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            databaseURL: "https://PROJEK_ANDA_DEFAULT-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Tampilan awal QRIS
        pilihMetode('qris');

        function pilihMetode(metode) {
            const infoDiv = document.getElementById('info-pembayaran');
            const btnQris = document.getElementById('btn-qris');
            const btnDana = document.getElementById('btn-dana');

            if (metode === 'qris') {
                btnQris.className = "p-3 border-2 border-emerald-600 rounded-xl text-center font-bold text-emerald-900 bg-emerald-50 transition";
                btnDana.className = "p-3 border-2 border-gray-300 rounded-xl text-center font-bold text-gray-700 transition";
                
                infoDiv.innerHTML = `
                    <p class="text-sm text-gray-600 mb-2">Scan QRIS di bawah ini menggunakan m-Banking atau E-Wallet:</p>
                    <div class="bg-white p-2 inline-block border rounded-lg shadow-sm">
                        <img src="https://via.placeholder.com/150" alt="QRIS Rohis" class="mx-auto w-40 h-40 object-cover">
                    </div>
                    <p class="text-xs text-gray-500 mt-2">A/N Kas Rohis Masjid Sekolah</p>
                `;
            } else {
                btnDana.className = "p-3 border-2 border-emerald-600 rounded-xl text-center font-bold text-emerald-900 bg-emerald-50 transition";
                btnQris.className = "p-3 border-2 border-gray-300 rounded-xl text-center font-bold text-gray-700 transition";
                
                infoDiv.innerHTML = `
                    <p class="text-sm text-gray-600 mb-2">Transfer melalui nomor DANA berikut:</p>
                    <div class="bg-emerald-100 p-3 rounded-lg border border-emerald-300">
                        <span class="text-xl font-extrabold text-emerald-900">0812-3456-7890</span>
                        <p class="text-xs text-emerald-700 mt-1">A/N Bendahara Rohis</p>
                    </div>
                `;
            }
        }

        // Kirim Data ke Firebase Realtime Database
        document.getElementById('form-bayar').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const kelas = document.getElementById('kelas').value;
            const jumlah = document.getElementById('jumlah').value;
            const tanggal = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            db.ref('pembayaran').push({
                nama: nama,
                kelas: kelas,
                jumlah: jumlah,
                tanggal: tanggal
            }, (error) => {
                if (error) {
                    alert("Gagal mengirim pembayaran. Coba lagi.");
                } else {
                    alert("Konfirmasi pembayaran berhasil dikirim! Data akan langsung masuk ke sistem.");
                    window.location.href = 'data.html';
                }
            });
        });
    </script>
</body>
</html>
